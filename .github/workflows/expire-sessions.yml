name: Expire session notes

# Deletes docs/sessions notes more than 7 days past their `created` timestamp (only if durable_promoted: true).
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report, do not delete'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: expire-sessions
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Plan (dry run)
        run: node scripts/expire-sessions.js | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply, verify scope, commit
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: |
          set -euo pipefail
          node scripts/expire-sessions.js --apply
          CHANGES=$(git status --porcelain)
          if [ -z "$CHANGES" ]; then echo "Nothing expired."; exit 0; fi
          # Safety: only deletions of note files directly inside docs/sessions/ are allowed.
          if echo "$CHANGES" | grep -vE '^ D docs/sessions/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.md$'; then
            echo "::error::unexpected changes, aborting"; git checkout -- .; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/sessions
          git commit -m "chore(sessions): expire session notes older than 7 days"
          git push origin HEAD:main
